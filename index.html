<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Agree?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* START SCREEN */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background: #101018;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 999999;
        }

        #startContent {
            text-align: center;
        }

        #startContent h1 {
            color: white;
            font-size: 70px;
            margin: 0 0 40px;
        }

        #startButton {
            background: white;
            color: black;

            border: none;
            border-radius: 12px;

            padding: 18px 60px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        #startButton:hover {
            transform: scale(1.05);
        }

        /* ACTUAL WEBSITE */
        #app {
            display: none;

            width: 100%;
            height: 100%;

            background: #101018;
            color: white;
        }

        header {
            height: 70px;
            padding: 0 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #333;
        }

        main {
            max-width: 800px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #1c1c28;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 50px;
        }

        #question {
            font-size: 42px;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .buttons button {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .agree {
            background: #20a464;
        }

        .disagree {
            background: #d84848;
        }
    </style>
</head>

<body>

    <!-- THIS IS THE START SCREEN -->
    <div id="startScreen">

        <div id="startContent">

            <h1>Do you agree?</h1>

            <button id="startButton">
                START
            </button>

        </div>

    </div>


    <!-- MAIN WEBSITE -->
    <div id="app">

        <header>

            <strong>Do You Agree?</strong>

            <button>📊 My Stats</button>

        </header>

        <main>

            <div class="card">

                <div id="category">
                    FOOD
                </div>

                <h1 id="question">
                    "It should be illegal to put pineapple on pizza."
                </h1>

                <div class="buttons">

                    <button class="agree">
                        👍 AGREE
                    </button>

                    <button class="disagree">
                        👎 DON'T AGREE
                    </button>

                </div>

            </div>

        </main>

    </div>


    <script>

        document
            .getElementById("startButton")
            .onclick = function() {

                document
                    .getElementById("startScreen")
                    .style.display = "none";

                document
                    .getElementById("app")
                    .style.display = "block";

            };

    </script>

</body>
</html>
