<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Agree?</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- START SCREEN -->
    <section id="startScreen">
        <div class="startContent">
            <h1>Do you agree?</h1>
            <button id="startButton">START</button>
        </div>
    </section>

    <!-- WEBSITE -->
    <div id="app">

        <header>
            <div class="logo">Do You Agree?</div>
            <button class="statsBtn" id="statsButton">📊 My Stats</button>
        </header>

        <main>

            <div class="counter" id="counter"></div>

            <div class="card">

                <div class="category" id="category"></div>

                <h2 id="question"></h2>

                <div class="buttons">
                    <button class="agree" id="agreeButton">
                        👍 AGREE
                    </button>

                    <button class="disagree" id="disagreeButton">
                        👎 DON'T AGREE
                    </button>
                </div>

                <div id="results" class="results hidden">

                    <div class="resultTitle">
                        Here's what people think:
                    </div>

                    <div class="percentages">
                        <div>
                            <strong id="agreePercent">0%</strong>
                            <span>Agree</span>
                        </div>

                        <div>
                            <strong id="disagreePercent">0%</strong>
                            <span>Don't Agree</span>
                        </div>
                    </div>

                    <div class="bar">
                        <div id="agreeBar"></div>
                    </div>

                    <p id="resultMessage"></p>

                </div>

            </div>

            <button id="nextButton" class="next hidden">
                Next Question →
            </button>

        </main>

        <div id="statsModal" class="modal hidden">

            <div class="modalContent">

                <button class="close" id="closeStats">×</button>

                <h2>📊 Your Stats</h2>

                <div class="stat">
                    <span>Questions answered</span>
                    <strong id="totalAnswered">0</strong>
                </div>

                <div class="stat">
                    <span>Agreed</span>
                    <strong id="totalAgree">0</strong>
                </div>

                <div class="stat">
                    <span>Didn't agree</span>
                    <strong id="totalDisagree">0</strong>
                </div>

            </div>

        </div>

        <footer>
            Made for people who have opinions.
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
