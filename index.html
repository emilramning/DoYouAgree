<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do You Agree?</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         START SCREEN
    ========================== -->

    <div id="startScreen">

        <div class="startContent">

            <h1>Do you agree?</h1>

            <button id="startButton">
                START
            </button>

        </div>

    </div>


    <!-- =========================
         MAIN WEBSITE
    ========================== -->

    <div id="app">

        <!-- HEADER -->

        <header>

            <div class="logo">
                Do You Agree?
            </div>

            <button id="statsButton" class="statsButton">
                📊 My Stats
            </button>

        </header>


        <!-- MAIN -->

        <main>

            <div id="counter" class="counter">
                Question 1
            </div>


            <div class="questionCard">

                <div id="category" class="category">
                    FOOD
                </div>


                <h2 id="question">
                    It should be illegal to put pineapple on pizza.
                </h2>


                <!-- VOTE BUTTONS -->

                <div class="voteButtons">

                    <button id="agreeButton" class="vote agree">
                        👍
                        <span>AGREE</span>
                    </button>


                    <button id="disagreeButton" class="vote disagree">
                        👎
                        <span>DON'T AGREE</span>
                    </button>

                </div>


                <!-- RESULTS -->

                <div id="results" class="results hidden">

                    <p class="resultTitle">
                        Here's what people think
                    </p>


                    <div class="percentages">

                        <div class="percentage">

                            <strong id="agreePercent">
                                0%
                            </strong>

                            <span>
                                Agree
                            </span>

                        </div>


                        <div class="percentage">

                            <strong id="disagreePercent">
                                0%
                            </strong>

                            <span>
                                Don't Agree
                            </span>

                        </div>

                    </div>


                    <!-- BAR -->

                    <div class="resultBar">

                        <div id="agreeBar"></div>

                    </div>


                    <p id="resultMessage" class="resultMessage"></p>

                </div>

            </div>


            <!-- NEXT -->

            <button id="nextButton" class="nextButton hidden">
                Next Question →
            </button>

        </main>


        <!-- =========================
             STATS MODAL
        ========================== -->

        <div id="statsModal" class="modal hidden">

            <div class="modalBox">

                <button id="closeStats" class="closeButton">
                    ×
                </button>


                <h2>
                    📊 Your Stats
                </h2>


                <div class="statRow">

                    <span>
                        Questions answered
                    </span>

                    <strong id="totalAnswered">
                        0
                    </strong>

                </div>


                <div class="statRow">

                    <span>
                        Agreed
                    </span>

                    <strong id="totalAgree">
                        0
                    </strong>

                </div>


                <div class="statRow">

                    <span>
                        Didn't agree
                    </span>

                    <strong id="totalDisagree">
                        0
                    </strong>

                </div>

            </div>

        </div>


        <footer>
            Made for people who have opinions.
        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
